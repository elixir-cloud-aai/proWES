---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.prowes.appName }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.prowes.appName }}
  template:
    metadata:
      labels:
        app: {{ .Values.prowes.appName }}
    spec:
      {{- if eq .Values.storageAccessMode "ReadWriteOnce" }}
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - {{ .Values.celeryWorker.appName }}
            topologyKey: "kubernetes.io/hostname"
      {{- end }}
      initContainers:
      - name: vol-init
        image: busybox
        command: [ 'mkdir' ]
        args: [ '-p', '/data/db', '/data/specs' ]
        resources: {{- toYaml .Values.prowes.initResources | nindent 10 }}
        volumeMounts:
        - mountPath: /data
          name: prowes-volume
      containers:
      - name: prowes
        image: {{ .Values.prowes.image }}
        imagePullPolicy: Always
        workingDir: '/app/pro_wes'
        command: [ 'gunicorn' ]
        args: [ '--log-level', 'debug', '-c', 'gunicorn.py', 'wsgi:app' ]
        env:
        - name: MONGO_HOST
          value: {{ .Values.mongodb.appName }}
        - name: MONGO_PORT
          value: "27017"
        - name: MONGO_USERNAME
          valueFrom:
            secretKeyRef:
              key: databaseUser
              name: {{ .Values.mongodb.appName }}
        - name: MONGO_PASSWORD
          valueFrom:
            secretKeyRef:
              key: databasePassword
              name: {{ .Values.mongodb.appName }}
        - name: MONGO_DBNAME
          valueFrom:
            secretKeyRef:
              key: databaseName
              name: {{ .Values.mongodb.appName }}
        - name: RABBIT_HOST
          value: {{ .Values.rabbitmq.appName }}
        - name: RABBIT_PORT
          value: "5672"
        resources: {{- toYaml .Values.prowes.resources | nindent 10 }}
        livenessProbe:
          tcpSocket:
            port: prowes-port
          initialDelaySeconds: 5
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /ga4gh/wes/v1/service-info
            port: prowes-port
          initialDelaySeconds: 3
          periodSeconds: 3
        ports:
        - containerPort: 8080
          name: prowes-port
        volumeMounts:
        - mountPath: /data
          name: prowes-volume
      volumes:
      - name: prowes-volume
        persistentVolumeClaim:
          claimName: {{ .Values.prowes.appName }}-volume
