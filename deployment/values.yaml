# Default values for protes_helm.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

applicationDomain: ""

# which cluster type proWES is going to be deployed on
# it can be either 'kubernetes' or 'openshift'
clusterType: kubernetes

# mongodb-pvc.yaml/rabbitmq-pvc.yaml, change to ReadWriteMany if storageClass can do RWX
storageAccessMode: ReadWriteOnce

flower:
  appName: prowes-flower
  basicAuth: admin:admin
  image: endocode/flower
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 300m
      memory: 500Mi
prowes:
  appName: prowes
  image: elixircloud/prowes:latest
  initResources:
    limits:
      memory: 16Mi
      cpu: 10m
    requests:
      memory: 16Mi
      cpu: 10m
  resources:
    limits:
      memory: 256Mi
      cpu: 100m
    requests:
      memory: 256Mi
      cpu: 100m

celeryWorker:
  appName: celery-worker
  image: elixircloud/prowes:latest
  initResources:
    limits:
      memory: 16Mi
      cpu: 10m
    requests:
      memory: 16Mi
      cpu: 10m
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 256Mi

mongodb:
  appName: mongodb
  databaseAdminPassword: adminpasswd
  databaseName: prowes-db
  databasePassword: prowes-db-passwd
  databaseUser: prowes-user
  volumeSize: 1Gi
  image: centos/mongodb-36-centos7
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 500m
      memory: 512Mi

rabbitmq:
  appName: rabbitmq
  volumeSize: 1Gi
  image: rabbitmq:3-management
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 256Mi

