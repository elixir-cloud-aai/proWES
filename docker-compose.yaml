services:

  prowes-worker:
    image: prowes:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    links:
      - mongodb
      - rabbitmq
    command: bash -c "cd /app/pro_wes; celery -A celery_worker worker -E --loglevel=info"
    volumes:
      - ${PROWES_DATA_DIR:-../data/pro_wes/runs}:/data

  prowes:
    image: prowes:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    links:
      - mongodb
    command: bash -c "cd /app; gunicorn -c pro_wes/gunicorn.py pro_wes.wsgi:app"
    ports:
      - "8090:8080"
    volumes:
      - ${PROWES_DATA_DIR:-../data/pro_wes/runs}:/data

  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    links:
      - mongodb
    ports:
      - "5672:5672"

  mongodb:
    image: mongo:3.2
    restart: unless-stopped
    volumes:
      - ${PROWES_DATA_DIR:-../data/pro_wes}/db:/data/db
    ports:
      - "27017:27017"

  flower:
    image: mher/flower:0.9.7
    restart: unless-stopped
    links:
      - prowes-worker
    command: flower --broker=amqp://guest:guest@rabbitmq:5672// --port=5555
    ports:
      - "5555:5555"
